[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "probai"
version = "0.3.1"
description = "Routes a question to the right probability model (dice, radio signals, banking, reliability, Bayes...) and computes the answer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ProbAI contributors" }]
keywords = ["probability", "machine-learning", "statistics", "bayesian", "risk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.2",
    "joblib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
probai = "probai.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/probai"
Issues = "https://github.com/YOUR_USERNAME/probai/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
probai = ["data/*.jsonl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
